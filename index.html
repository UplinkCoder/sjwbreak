<html>
<head>
    <title>SJW Break</title>
</head>
<body>
    <audio id="bounce" preload="auto">
        <source src="ogg/bounce.ogg" type="audio/ogg">
    </audio>
    <p id="score" style="color:white;position:absolute;left:20px;top:20px"> Score: 0 </p>
    <canvas id="game" width="800" height="600" style="Border:1px solid #000;"></canvas>
    <div>
        <p> Art by <a href="https://www.kenney.nl">Kenney.nl</a></p>
        <p id="pTag"></p>
    </div>
    <script type = "text/javascript">
    // Copied vector class from: https://gist.github.com/Dalimil/3daf2a0c531d7d030deb37a7bfeff454
    function vec2(x, y) {
        this.x = (x === undefined) ? 0 : x;
        this.y = (y === undefined) ? 0 : y;
    }

    vec2.prototype = {
        clone: function() {
            return new vec2(this.x, this.y);
        },

        add: function(vector) {
            return new vec2(this.x + vector.x, this.y + vector.y);
        },

        magnitude: function() {
            return Math.sqrt(this.x * this.x + this.y * this.y);
        },

        normalize: function() {
            var mag = this.magnitude();
            var vector = this.clone();
            if(Math.abs(mag) < 1e-9) {
                vector.x = 0;
                vector.y = 0;
            } else {
                vector.x /= mag;
                vector.y /= mag;
            }
            return vector;
        },

        toString: function () {
            var vector = this;
            return ("[" + vector.x.toFixed(2) + "; " + vector.y.toFixed(2) + "]");
        }
    };
    </script>
    <script type="text/javascript">
        var CanvasWidth    = 800;
        var CanvasHeight   = 600;
        var BorderWidth    = 8;
        var BallSpeed      = 8;
        var BallWidth      = 10;
        var BallHeight     = 10;

        var BrickWidth     = 40;
        var BrickHeight    = 15;

        var PaddleSpeed    = 15;
        var PaddleWidth    = CanvasWidth * 0.1;
        var PaddleHeight   = 12;
        var FrameTime      = 33; //Target ~30 FPS

        var BallImage   = new Image();
        var PaddleImage = new Image();
        BallImage.src   = "png/ballGrey.png";
        PaddleImage.src = "png/paddleBlu.png";

        var Bounce = document.getElementById('bounce');

        var Canvas = document.getElementById('game');
        var Ctx = Canvas.getContext('2d');
        function pTag(content) {
            document.getElementById('pTag').innerHTML = content;
        }
        // switch to right handed coordinates
        Ctx.translate(0, CanvasHeight);
        Ctx.scale(1, -1);

        /* this Backround is AI Slop */

        var Gradient = Ctx.createRadialGradient(0, 0, CanvasWidth, CanvasHeight, 1 , 1);
        Gradient.addColorStop(0,    'rgb(60,  0, 120)'); // Red
        Gradient.addColorStop(0.1,  'rgb(0,   0, 255)'); // Blue
        Gradient.addColorStop(0.9,  'rgb(75,  0, 130)'); // Indigo
        Gradient.addColorStop(1,    'rgb(143, 0, 255)'); // Violet

        /* this Backround is AI Slop */

        var Left  = 1;
        var Right = 2;
        var Space = 3;

        var Score = 0;

        function game_obj_t(position, velocity, size, imageOrColorString, onHit) {
            this.position            = position;
            this.velocity            = velocity;
            this.size                = size;
            this.imageOrColorString  = imageOrColorString;
            this.onHit               = onHit;
        };

        function getBounds(gameObj) {
            var halfWidth  = gameObj.size.x / 2;
            var halfHeight = gameObj.size.y / 2;
            return {
                x0 : gameObj.position.x - halfWidth,
                x1 : gameObj.position.x + halfWidth,
                y0 : gameObj.position.y - halfHeight,
                y1 : gameObj.position.y + halfHeight
            };
        }

        function collides(objA, objB) {
            var bbA = getBounds(objA);
            var bbB = getBounds(objB);

            return (bbA.x0 <= bbB.x1 && bbA.x1 >= bbB.x0 &&
                    bbA.y0 <= bbB.y1 && bbA.y1 >= bbB.y0);
        };
/*
        AI generated template:
        // Verbindung der Mittelpunkte bestimmen
        normale = normalize(B.position - A.position)

        // Tangente zur Normalen bestimmen
        tangente = (-normale.y, normale.x)

        // Geschwindigkeiten in Normal- und Tangentialanteil zerlegen
        A_normal     = dot(A.velocity, normale)
        A_tangential = dot(A.velocity, tangente)

        B_normal     = dot(B.velocity, normale)
        B_tangential = dot(B.velocity, tangente)

        // Bei gleicher Masse:
        // Normalanteile tauschen
        temp = A_normal
        A_normal = B_normal
        B_normal = temp

        // Neue Geschwindigkeiten zusammensetzen
        A.velocity =
              normale  * A_normal
            + tangente * A_tangential

        B.velocity =
              normale  * B_normal
            + tangente * B_tangential
*/
        function applyVelocityAfterBallOnBallCollision(objA, objB) {

            var normalX      = objB.position.x - objA.position.x;
            var normalY      = objB.position.y - objA.position.y;
            var normalLength = Math.sqrt(normalX * normalX + normalY * normalY);

            normalX /= normalLength;
            normalY /= normalLength;

            var tangentX = -normalY;
            var tangentY = normalX;

            var contributionA = objA.velocity.x * normalX  + objA.velocity.y * normalY;
            var contributionB = objB.velocity.x * normalX  + objB.velocity.y * normalY;

            var retainedA     = objA.velocity.x * tangentX + objA.velocity.y * tangentY;
            var retainedB     = objB.velocity.x * tangentX + objB.velocity.y * tangentY;

            objA.velocity.x = contributionB * normalX + retainedA * tangentX;
            objA.velocity.y = contributionB * normalY + retainedA * tangentY;

            objB.velocity.x = contributionA * normalX + retainedB * tangentX;
            objB.velocity.y = contributionA * normalY + retainedB * tangentY;

            objA.velocity = objA.velocity.normalize();
            objB.velocity = objB.velocity.normalize();
        }


        function applyVelocityChangeAfterCollisionWith(ball, brick) {
            var brickBounds = getBounds(brick);
            var ballP = ball.position;

            var distFromBottom = Math.abs(ballP.y - brickBounds.y0);
            var distFromTop    = Math.abs(ballP.y - brickBounds.y1);
            var distFromLeft   = Math.abs(ballP.x - brickBounds.x0);
            var distFromRight  = Math.abs(ballP.x - brickBounds.x1);

            var smallestDistance = Math.min(distFromBottom, distFromTop, distFromLeft, distFromRight);
            switch(smallestDistance)
            {
                case distFromBottom:{ ball.velocity.y = -Math.abs(ball.velocity.y) } break;
                case distFromTop:   { ball.velocity.y =  Math.abs(ball.velocity.y) } break;
                case distFromLeft:  { ball.velocity.x = -Math.abs(ball.velocity.x) } break;
                case distFromRight: { ball.velocity.x =  Math.abs(ball.velocity.x) } break;
            }
            // pTag("BallVelocity: " + ball.velocity.toString() );
        }

        game_obj_t.prototype = {
            clone: function () {
                return new game_obj_t(
                    this.position.clone(),
                    this.velocity.clone(),
                    this.size.clone(),
                    this.imageOrColorString,
                    this.onHit
                );
            }
        };

        var ProtoBorder = {
            imageOrColorString: "rgb(160, 30, 160)",
            velocity: new vec2(0, 0),

            newBorder: function (position, size) {
                return new game_obj_t(
                    position,
                    this.velocity,
                    size,
                    this.imageOrColorString
                );
            }
        };

        var ProtoBall = {
            size: new vec2(BallWidth, BallHeight),
            imageOrColorString: BallImage,

            newBall: function (position, velocity) {
                return new game_obj_t(
                    position,
                    velocity,
                    this.size,
                    this.imageOrColorString
                );
            }
        };

        var ProtoBrick = {
            size: new vec2(BrickWidth, BrickHeight),
            velocity: new vec2(0, 0),
            imageOrColorString: "rgb(200, 60, 30)",

            newBrick: function (position) {
                var b = new game_obj_t(
                    position,
                    this.velocity,
                    this.size,
                    this.imageOrColorString,
                    function () {
                        playSound(Bounce);
                        Score += 20;
                        collidersToRemove.push(colliders.indexOf(b));
                    }
                );
                return b;
            }
        };

        var HorizontalBorderSize = new vec2(BorderWidth, CanvasHeight);
        var VerticalBorderSize   = new vec2(CanvasWidth, BorderWidth);
        var LeftBorder   = ProtoBorder.newBorder(new vec2(              BorderWidth/2, CanvasHeight/2), HorizontalBorderSize);
        var RightBorder  = ProtoBorder.newBorder(new vec2(CanvasWidth - BorderWidth/2, CanvasHeight/2), HorizontalBorderSize);
        var TopBorder    = ProtoBorder.newBorder(new vec2(CanvasWidth/2 - BorderWidth/2, CanvasHeight - BorderWidth/2), VerticalBorderSize);
        var BottomBorder = ProtoBorder.newBorder(new vec2(CanvasWidth/2 - BorderWidth/2,                BorderWidth/2), VerticalBorderSize);

        // input state
        var isDown  = [];
        var wasDown = [];

        // gameState
        var balls = [];
        var colliders = [];
        var collidersToRemove = [];

        var paddle = new game_obj_t(
            new vec2 (CanvasWidth / 2, (PaddleHeight / 2) + BorderWidth),
            new vec2(0,0),
            new vec2(PaddleWidth, PaddleHeight),
            PaddleImage
        );

        var gameRunning = 0; // Test variable
        var lastTime = Date.now();
        var dt = 0;

        colliders.push(LeftBorder);
        colliders.push(RightBorder);
        colliders.push(TopBorder);

        var LeftArrow_Key  = 37;
        var RightArrow_Key = 39;
        var Space_Key      = 32;
        var Keys = [Space, Left, Right];

        for (var i = 0; i < Keys.length; i++) {
            var key = Keys[i];
            wasDown[key] = false;
        }

        function addBricks () {
            var y = 450;

            for(var x = 60; x < CanvasWidth - 60; x += 60)
            {
                colliders.push(ProtoBrick.newBrick(new vec2(x, y)));
            }
        }
        addBricks();

        window.onkeydown = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = true;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = true;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = true;
            }
        }

        window.onkeyup = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = false;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = false;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = false;
            }
        }

        function playSound(sound) {
            if (sound.playing) sound.pause(); // Reset durch Pausieren
            sound.currentTime = 0;
            sound.play();
        }

        function drawObj(gameObj) {
            var p = gameObj.position;
            var sz = gameObj.size;
            var x0 = p.x - sz.x / 2;
            var y0 = p.y - sz.y / 2;
            if (gameObj.imageOrColorString instanceof Image)
            {
                Ctx.drawImage(gameObj.imageOrColorString, x0, y0, sz.x, sz.y);
            }
            else
            {
                Ctx.fillStyle = gameObj.imageOrColorString;
                Ctx.fillRect(x0, y0, sz.x, sz.y);
            }
        };

        function drawPaddle() {
            drawObj(paddle);
        }

        function drawBalls() {
            for(var i = 0; i < balls.length; i++)
            {
                var ball = balls[i];
                drawObj(ball);
            }
        }

        function drawColliders() {
            for(var i = 0; i < colliders.length; i++)
            {
                var collider = colliders[i];
                drawObj(collider);
            }
        }

        function updatePaddle() {
            var pp = paddle.position;
            var pv = paddle.velocity;
            var pDelta = Math.floor(PaddleSpeed * dt);

            var xDelta = 0;
            if (isDown[Left] && !isDown[Right]) {
                pv.x = -PaddleSpeed;
                xDelta = -pDelta;
            } else
            if (isDown[Right] && !isDown[Left]) {
                pv.x = +PaddleSpeed;
                xDelta = +pDelta;
            } else {
                pv.x = 0;
            }
            pp.x = pp.x + xDelta;

            if (pp.x > CanvasWidth - (PaddleWidth/2 + BorderWidth)) {
                pp.x = CanvasWidth - (PaddleWidth/2 + BorderWidth);
                pv.x = 0;
            }
            if (pp.x < PaddleWidth/2 + BorderWidth) {
                pp.x = PaddleWidth/2 + BorderWidth;
                pv.x = 0;
            }
        }

        function updateBalls() {
            var ballsToRemove = [];
            var pb = getBounds(paddle);

            for(var i = 0; i < balls.length; i++) {
                var ball = balls[i];
                var bb = getBounds(ball);
                // var possibleColliders = getColliders(collsionGrid, bb);

                for(var cIndex = 0; cIndex < colliders.length; cIndex++)
                {
                    var c = colliders[cIndex];
                    if (collides(ball, c))
                    {
                        playSound(Bounce);
                        if (c.onHit !== undefined) { c.onHit(); }
                        applyVelocityChangeAfterCollisionWith(ball, c);
                        break;
                    }
                }

                for (var bIndex = i + 1; bIndex < balls.length; bIndex++)
                {
                    var otherBall = balls[bIndex];
                    if (collides(ball, otherBall))
                    {
                        applyVelocityAfterBallOnBallCollision(ball, otherBall);
                    }
                }

                if (collides(ball, paddle)) {
                    var paddleX0 = (paddle.position.x - PaddleWidth/2);
                    var t = 1 - ((ball.position.x - paddleX0) / PaddleWidth);

                    playSound(Bounce);
                    // applyVelocityChangeAfterCollisionWith(ball, paddle);
                    ball.velocity = upwardsVector(t);
                    // pTag("Ball.v: " + ball.velocity.toString());
                    // direct velocity upwards
                    // point on the paddle that the collision occured at from [0 to 1]
                    ball.velocity.y += 0.5 * Math.abs(paddle.velocity.x);
                    ball.velocity.x += 0.5 * paddle.velocity.x;
                    ball.velocity = ball.velocity.normalize();
                }
                // if ball y1 position is under border destroy
                if (bb.y1 <= BorderWidth) {
                    ballsToRemove.push(i);
                }
                var bDelta = BallSpeed * dt;
                var xDelta = ball.velocity.x * bDelta;
                var yDelta = ball.velocity.y * bDelta;

                ball.position.x += xDelta;
                ball.position.y += yDelta;
            }

            for(var i = ballsToRemove.length - 1; i >= 0; --i) {
                var bi = ballsToRemove[i];
                balls.splice(bi, 1);
                Score -= 40;
            }
        }

        function upwardsVector(tAngle) {
            // tAngle should be a value from 0 to 1 which tells us how far to go along the upwards cone.
            var sectorAngle = Math.PI / 2.25;
            var startAngle  = (Math.PI / 2) - sectorAngle;
            var endAngle    = (Math.PI / 2) + sectorAngle;
            var launchAngle = startAngle + (tAngle * (endAngle - startAngle));
            var ballDirection = new vec2(Math.cos(launchAngle), Math.sin(launchAngle));
            return ballDirection.normalize();
        }

        /* this Backround is AI Slop */
        function drawBackground() {
            Ctx.fillStyle = Gradient;
            Ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);
        }
        /* this Backround is AI Slop */

        function gameLoop() {
            var now = Date.now();
            dt = (Math.min(now - lastTime, FrameTime) / FrameTime);
            // Logic
            if (isDown[Space] && !wasDown[Space]) {
                var randomT = Math.random();
                var pp = paddle.position;
                var direction = upwardsVector(randomT);
                // pTag("launchDirection: " + direction.toString() + " --- randomT: " + randomT.toString());
                balls.push(
                    ProtoBall.newBall(new vec2(
                        pp.x,
                        pp.y + PaddleHeight/2 + BallWidth/2 + 0.01
                    ), direction)
                );
            }
            // simulate
            updatePaddle();
            updateBalls ();
            // draw
            drawBackground();
            drawPaddle();
            drawBalls();
            drawColliders();
            document.getElementById('score').innerHTML = "Score: " + Score.toString();
            for(var i = collidersToRemove.length - 1; i >= 0; --i) {
                var ci = collidersToRemove[i];
                colliders.splice(ci, 1);
            }
            collidersToRemove = [];
            // update old state for delta
            lastTime = now;
            for (var i = 0; i < Keys.length; i++) {
                wasDown[Keys[i]] = isDown[Keys[i]];
            }
        }
        var gameInterval = setInterval(gameLoop, FrameTime);

        window.onbeforeunload = function() {
            clearInterval(gameInterval);
        };
    </script>

</body>
</html>
