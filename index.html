<html>
<head>
    <title>SJW Break</title>
</head>
<body>

    <canvas id="game" width="800" height="600" style="Border:1px solid #000;"></canvas>
    <div>
        <p> Art by <a href="www.kenny.nl">Kenny.nl</a></p>
        <p id="pTag"></p>
        <p id="pTag2"></p>
    </div>
    <script type = "text/javascript">
    // Copied vector class from: https://gist.github.com/Dalimil/3daf2a0c531d7d030deb37a7bfeff454
    function vec2(x, y) {
        this.x = (x === undefined) ? 0 : x;
        this.y = (y === undefined) ? 0 : y;
    }

    vec2.prototype = {
        clone: function() {
            return new vec2(this.x, this.y);
        },

        add: function(vector) {
            return new vec2(this.x + vector.x, this.y + vector.y);
        },

        magnitude: function() {
            return Math.sqrt(this.x * this.x + this.y * this.y);
        },

        normalize: function() {
            var mag = this.magnitude();
            var vector = this.clone();
            if(Math.abs(mag) < 1e-9) {
                vector.x = 0;
                vector.y = 0;
            } else {
                vector.x /= mag;
                vector.y /= mag;
            }
            return vector;
        },

        toString: function () {
            var vector = this.toPrecision(1);
            return ("[" + vector.x + "; " + vector.y + "]");
        }
    };
    </script>
    <script type="text/javascript">
        var CanvasWidth    = 800;
        var CanvasHeight   = 600;
        var Border         = 8;
        var BallSpeed      = 8;
        var BallWidth      = 10;
        var BallHeight     = 10;

        var BrickWidth     = 20;
        var BrickHeight    = 15;
        
        var PaddleSpeed    = 15;
        var PaddleWidth    = CanvasWidth * 0.1;
        var PaddleHeight   = 10;
        var FrameTime      = 33; //Target ~30 FPS

        var BallImage   = new Image();
        var PaddleImage = new Image();
        BallImage.src   = "png/ballGrey.png";
        PaddleImage.src = "png/paddleBlu.png";

        var Canvas = document.getElementById('game');
        var Ctx = Canvas.getContext('2d');
        function pTag2(content) {
            document.getElementById('pTag2').innerHTML = content;
        }
        // switch to right handed coordinates
        Ctx.translate(0, CanvasHeight);
        Ctx.scale(1, -1);

        /* this Backround is AI Slop */

        var Gradient = Ctx.createRadialGradient(0, 0, CanvasWidth, CanvasHeight, 1 , 1);
        Gradient.addColorStop(0,    'rgb(60,  0, 120)'); // Red
        Gradient.addColorStop(0.1,  'rgb(0,   0, 255)'); // Blue
        Gradient.addColorStop(0.9,  'rgb(75,  0, 130)'); // Indigo
        Gradient.addColorStop(1,    'rgb(143, 0, 255)'); // Violet

        /* this Backround is AI Slop */

        var Left  = 1;
        var Right = 2;
        var Space = 3;

        function game_obj_t(position, velocity) {
            this.position = position;
            this.velocity = velocity;
        };

        game_obj_t.prototype = {};

        var isDown = [];
        var wasDown = [];
        var balls = [];
        var bricks = [];
        var gameRunning = 0; // Test variable
        var lastTime = Date.now();
        var dt = 0;

        var paddle = new game_obj_t( new vec2(CanvasWidth / 2, (PaddleHeight / 2) + Border), new vec2(0,0));

        var LeftArrow_Key  = 37;
        var RightArrow_Key = 39;
        var Space_Key      = 32;
        var Keys = [Space, Left, Right];

        for (var i = 0; i < Keys.length; i++) {
            var key = Keys[i];
            wasDown[key] = false;
        }

        function addBrick (row, col) {
            
        }

        window.onkeydown = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = true;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = true;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = true;
            }
        }

        window.onkeyup = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = false;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = false;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = false;
            }
        }

        function drawPaddle() {
            Ctx.fillStyle = 'rgb(200, 160, 110)';
            // positions are centroids
            var pp = paddle.position;
            var leftX   = pp.x - (PaddleWidth  / 2);
            var bottomY = pp.y - (PaddleHeight / 2);
            Ctx.drawImage(PaddleImage, leftX, bottomY, PaddleWidth, PaddleHeight);
            // Ctx.fillRect(leftX, bottomY, PaddleWidth, PaddleHeight);
        }

        function drawBalls() {
            var ballColor = 'rgb(100, 180, 120)';
            Ctx.fillStyle = ballColor;
            for(var i = 0; i < balls.length; i++)
            {
                var ball = balls[i];
                var posBall = ball.position;
                var leftX   = posBall.x - (BallWidth  / 2);
                var bottomY = posBall.y - (BallHeight / 2);
                Ctx.drawImage(BallImage, leftX, bottomY, BallWidth, BallHeight);   
                 //Ctx.fillRect(leftX, bottomY, BallWidth, BallHeight);
            }
        }

        function getBounds(gameObj, width, height) {
            var halfWidth = width/2;
            var halfHeight = height/2;
            return { x0 : gameObj.position.x - halfWidth,
                  x1 : gameObj.position.x + halfWidth,
                  y0 : gameObj.position.y - halfHeight,
                  y1 : gameObj.position.y + halfHeight };
        }

        function updatePaddle() {
            var pp = paddle.position;
            var pv = paddle.velocity;
            var pDelta = Math.floor(PaddleSpeed * dt);

            var xDelta = 0;
            if (isDown[Left] && !isDown[Right]) {
                pv.x = -PaddleSpeed;
                xDelta = -pDelta;
            } else
            if (isDown[Right] && !isDown[Left]) {
                pv.x = +PaddleSpeed;
                xDelta = +pDelta;
            } else {
                pv.x = 0;
            }
            pp.x = pp.x + xDelta;

            document.getElementById('pTag').innerHTML = "Paddle: X: " + pp.x.toString() + " Y: " + pp.y.toString();
            if (pp.x > CanvasWidth - (PaddleWidth/2 + Border)) {
                pp.x = CanvasWidth - (PaddleWidth/2 + Border);
                pv.x = 0;
            }
            if (pp.x < PaddleWidth/2 + Border) {
                pp.x = PaddleWidth/2 + Border;
                pv.x = 0;
            }
        }

        function updateBalls() {
            var ballsToRemove = [];
            var pb = getBounds(paddle, PaddleWidth, PaddleHeight);

            for(var i = 0; i < balls.length; i++) {
                var ball = balls[i];
                var bb = getBounds(ball, BallWidth, BallHeight);
        
                if (bb.x0 <= Border) {
                    ball.velocity.x = Math.abs(ball.velocity.x);
                }
                if (bb.x1 >= (CanvasWidth - Border)) {
                    ball.velocity.x = -Math.abs(ball.velocity.x)
                }
                if (bb.y1 >= (CanvasHeight - Border)) {
                    ball.velocity.y = -Math.abs(ball.velocity.y);
                }
                if (bb.y0 <= pb.y1 && bb.y1 > Border) {
                    if (bb.x0 >= pb.x0 && bb.x1 <= pb.x1) {
                        // direct velocity upwards
                        ball.velocity.y = Math.abs(ball.velocity.y) + 0.3 * Math.abs(paddle.velocity.x);
                        ball.velocity.x = ball.velocity.x + 0.3 * paddle.velocity.x;
                        ball.velocity = ball.velocity.normalize();
                        if (paddle.velocity.x != 0) { 
                             pTag2("paddle contributed");
                        } else {
                             pTag2("");
                        }
                    }
                }
                // if ball y1 position is under border destroy
                if (bb.y1 <= Border) {
                    ballsToRemove.push(i);
                }
                var bDelta = BallSpeed * dt;
                var xDelta = ball.velocity.x * bDelta;
                var yDelta = ball.velocity.y * bDelta;

                ball.position.x += xDelta;
                ball.position.y += yDelta;
            }

            for(var i = ballsToRemove.length - 1; i >= 0; --i) {
                var bi = ballsToRemove[i];
                balls.splice(bi, 1);
            }
        }

        function randomUpwardsVecotor() {
            var sectorAngle = Math.PI / 2.25;
            var startAngle  = (Math.PI / 2) - sectorAngle;
            var endAngle    = (Math.PI / 2) + sectorAngle;
            var randomAngle = startAngle + (Math.random() * (endAngle - startAngle));
            var ballDirection = new vec2(Math.cos(randomAngle), Math.sin(randomAngle));
            return ballDirection.normalize();
        }

        /* this Backround is AI Slop */
        function drawBackground() {
            Ctx.fillStyle = Gradient;
            Ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);
        }
        /* this Backround is AI Slop */

        function gameLoop() {
            var now = Date.now();
            dt = (Math.min(now - lastTime, FrameTime) / FrameTime);
            // Logic
            if (isDown[Space] && !wasDown[Space]) {
                var pp = paddle.position;
                balls.push(new game_obj_t (new vec2(
                    pp.x + PaddleWidth/2  - BallWidth/2,
                    pp.y + PaddleHeight/2 - BallHeight/2
                ), randomUpwardsVecotor()) );
            }
            // simulate
            updatePaddle();
            updateBalls ();
            // draw
            drawBackground();
            drawPaddle();
            drawBalls();

            // update old state for delta
            lastTime = now;
            for (var i = 0; i < Keys.length; i++) {
                wasDown[Keys[i]] = isDown[Keys[i]];
            }
        }
        setInterval(gameLoop, FrameTime);
    </script>

</body>
</html>
