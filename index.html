<html>
<head>
    <title>SJW Break</title>
</head>
<body>

    <canvas id="game" width="800" height="600" style="Border:1px solid #000;"></canvas>
    <div>
        <p id="pTag"> debugText </p>
        <p id="pTag2"></p>  
    </div>
    <script type = "text/javascript">
    // Copied vector class from: https://gist.github.com/Dalimil/3daf2a0c531d7d030deb37a7bfeff454
    function vec2(x, y) {
        this.x = (x === undefined) ? 0 : x;
        this.y = (y === undefined) ? 0 : y;
    }

    vec2.prototype = {
        set: function(x, y) {
            this.x = x || 0;
            this.y = y || 0;
        },

        clone: function() {
            return new vec2(this.x, this.y);
        },

        add: function(vector) {
            return new vec2(this.x + vector.x, this.y + vector.y);
        },

        addInPlace: function(vector) {
            this.x += vector.x;
            this.y += vector.y;
        },


        subtract: function(vector) {
            return new vec2(this.x - vector.x, this.y - vector.y);
        },

        scale: function(scalar) {
            return new vec2(this.x * scalar, this.y * scalar);
        },

        dot: function(vector) {
            return (this.x * vector.x + this.y * vector.y);
        },

        moveTowards: function(vector, t) {
            // Linearly interpolates between vectors A and B by t.
            // t = 0 returns A, t = 1 returns B
            t = Math.min(t, 1); // still allow negative t
            var diff = vector.subtract(this);
            return this.add(diff.scale(t));
        },

        magnitude: function() {
            return Math.sqrt(this.magnitudeSqr());
        },

        magnitudeSqr: function() {
            return (this.x * this.x + this.y * this.y);
        },

        distance: function (vector) {
            return Math.sqrt(this.distanceSqr(vector));
        },

        distanceSqr: function (vector) {
            var deltaX = this.x - vector.x;
            var deltaY = this.y - vector.y;
            return (deltaX * deltaX + deltaY * deltaY);
        },

        normalize: function() {
            var mag = this.magnitude();
            var vector = this.clone();
            if(Math.abs(mag) < 1e-9) {
                vector.x = 0;
                vector.y = 0;
            } else {
                vector.x /= mag;
                vector.y /= mag;
            }
            return vector;
        },

        angle: function() {
            return Math.atan2(this.y, this.x);
        },

        rotate: function(alpha) {
            var cos = Math.cos(alpha);
            var sin = Math.sin(alpha);
            var vector = new vec2();
            vector.x = this.x * cos - this.y * sin;
            vector.y = this.x * sin + this.y * cos;
            return vector;
        },

        toPrecision: function(precision) {
            var vector = this.clone();
            vector.x = vector.x.toFixed(precision);
            vector.y = vector.y.toFixed(precision);
            return vector;
        },

        toString: function () {
            var vector = this.toPrecision(1);
            return ("[" + vector.x + "; " + vector.y + "]");
        }
    };
    </script>
    <script type="text/javascript">
        var CanvasWidth    = 800;
        var CanvasHeight   = 600;
        var Border         = 8;
        var BallSpeed      = 8;
        var BallWidth      = 10;
        var BallHeight     = 10;
        var PaddleSpeed    = 15;
        var PaddleWidth    = CanvasWidth * 0.1;
        var PaddleHeight   = 10;
        var FrameTime      = 33; //Target ~30 FPS


        var Canvas = document.getElementById('game');
        var Ctx = Canvas.getContext('2d');
        // switch to right handed coordinates
        Ctx.translate(0, CanvasHeight);
        Ctx.scale(1, -1);

        /* this Backround is AI Slop */

        var Gradient = Ctx.createRadialGradient(0, 0, CanvasWidth, CanvasHeight, 1 , 1);
        Gradient.addColorStop(0,    'rgb(60, 0, 120)');   // Red
        Gradient.addColorStop(0.1,  'rgb(0, 0, 255)');   // Blue
        Gradient.addColorStop(0.9, 'rgb(75, 0, 130)');  // Indigo
        Gradient.addColorStop(1,    'rgb(143, 0, 255)'); // Violet

        /* this Backround is AI Slop */

        var Left  = 1;
        var Right = 2;
        var Space = 3;

        function game_obj_t(position, velocity) {
            this.position = position;
            this.velocity = velocity;
        };

        game_obj_t.prototype = {};

        var isDown = [];
        var wasDown = [];
        var balls = [];
        var gameRunning = 0; // Test variable
        var lastTime = Date.now();

        var paddle = new game_obj_t( new vec2(CanvasWidth / 2, (PaddleHeight / 2) + Border), new vec2(0,0));

        var LeftArrow_Key  = 37;
        var RightArrow_Key = 39;
        var Space_Key      = 32;
        var Keys = [Space, Left, Right];

        for (var i = 0; i < Keys.length; i++) {
            var key = Keys[i];
            wasDown[key] = false;
        }

        window.onkeydown = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = true;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = true;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = true;
            }
        }

        window.onkeyup = function(e) {
            if (e.keyCode == LeftArrow_Key)
            {
                isDown[Left] = false;
            }
            if (e.keyCode == RightArrow_Key)
            {
                isDown[Right] = false;
            }
            if (e.keyCode == Space_Key)
            {
                isDown[Space] = false;
            }
        }

        function drawPaddle() {
            Ctx.fillStyle = 'rgb(200, 160, 110)';
            // positions are centroids
            var pp = paddle.position;
            var leftX   = pp.x - (PaddleWidth  / 2);
            var bottomY = pp.y - (PaddleHeight / 2);
            Ctx.fillRect(leftX, bottomY, PaddleWidth, PaddleHeight);
        }

        function drawBalls() {
            var ballColor = 'rgb(100, 180, 120)';
            Ctx.fillStyle = ballColor;
            for(var i = 0; i < balls.length; i++)
            {
                var ball = balls[i];
                var posBall = ball.position;
                var leftX   = posBall.x - (BallWidth  / 2);
                var bottomY = posBall.y - (BallHeight / 2);
                Ctx.fillRect(leftX, bottomY, BallWidth, BallHeight);
            }
        }

        function updatePaddle(dt) {
            var pDelta = PaddleSpeed * dt;
            var pp = paddle.position;
            var pv = paddle.velocity;
            var xDelta = 0;
            if (isDown[Left] && !isDown[Right]) {
                pv.x = -PaddleSpeed;
                xDelta = -pDelta;
            } else
            if (isDown[Right] && !isDown[Left]) {
                pv.x = +PaddleSpeed;
                xDelta = +pDelta;
            } else {
                pv.x = 0;
            }
            pp.x = pp.x + xDelta;

            document.getElementById('pTag').innerHTML = "Paddle: X: " + pp.x.toString() + " Y: " + pp.y.toString();
            if (pp.x > CanvasWidth - (PaddleWidth/2 + Border)) {
                pp.x = CanvasWidth - (PaddleWidth/2 + Border);
                pv.x = 0;
            }
            if (pp.x < PaddleWidth/2 + Border) {
                pp.x = PaddleWidth/2 + Border;
                pv.x = 0;
            }
        }

        function updateBalls(dt) {
            var ballsToRemove = [];
            var pDelta = BallSpeed * dt;
            var pp = paddle.position;
            var px0 = (pp.x - PaddleWidth/2);
            var px1 = (pp.x + PaddleWidth/2);
            var py1 = (pp.y + PaddleHeight/2);

            for(var i = 0; i < balls.length; i++) {
                var ball = balls[i];
                var bx0 = ball.position.x - BallWidth / 2;
                var bx1 = bx0 + BallWidth;
                var by0 = ball.position.y - BallHeight / 2;
                var by1 = by0 + BallHeight;

                if (bx1 <= Border) {
                    ball.velocity.x = Math.abs(ball.velocity.x);
                }
                if (bx1 >= (CanvasWidth - Border)) {
                    ball.velocity.x = -Math.abs(ball.velocity.x)
                }
                if (by1 >= (CanvasHeight - Border)) {
                    ball.velocity.y = -Math.abs(ball.velocity.y);
                }
                if (by0 <= py1 && by1 > Border) {
                    if (bx0 >= px0 && bx1 < px1) {
                        // direct velocity upwards
                        ball.velocity.y = Math.abs(ball.velocity.y) + 0.3 * Math.abs(paddle.velocity.x);
                        ball.velocity.x = ball.velocity.x + 0.3 * paddle.velocity.x;
                        ball.velocity = ball.velocity.normalize();
                        if (paddle.velocity.x != 0) { 
                             document.getElementById('pTag2').innerHTML = "paddle contributed";
                        } else {
                             document.getElementById('pTag2').innerHTML = "";
                        }
                    }
                }
                if (by1 <= Border) {
                    ballsToRemove.push(i);
                }

                var xDelta = (ball.velocity.x * pDelta);
                var yDelta = (ball.velocity.y * pDelta);

                var nextX0 = bx0 + xDelta;
                var nextY0 = by0 + yDelta;
                var nextX1 = nextX0 + BallWidth;
                var nextY1 = nextY0 + BallHeight;

                ball.position.x = nextX0 + BallWidth / 2;
                ball.position.y = nextY0 + BallHeight / 2;
            }

            for(var i = ballsToRemove.length - 1; i >= 0; --i) {
                var bi = ballsToRemove[i];
                balls.splice(bi, 1);
            }
        }

        function randomUpwardsVecotor() {
            var sectorAngle = Math.PI / 2.25;
            var startAngle  = (Math.PI / 2) - sectorAngle;
            var endAngle    = (Math.PI / 2) + sectorAngle;
            var randomAngle = startAngle + (Math.random() * (endAngle - startAngle));
            var ballDirection = new vec2(Math.cos(randomAngle), Math.sin(randomAngle));
            return ballDirection.normalize();
        }

        /* this Backround is AI Slop */
        function drawBackground() {
            Ctx.fillStyle = Gradient;
            Ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);
        }
        /* this Backround is AI Slop */

        function gameLoop() {
            var now = Date.now();
            var dt = now - lastTime;
            // Logic
            if (isDown[Space] && !wasDown[Space]) {
                var pp = paddle.position;
                balls.push(new game_obj_t (new vec2(
                    pp.x + PaddleWidth/2  - BallWidth/2,
                    pp.y + PaddleHeight/2 - BallHeight/2
                ), randomUpwardsVecotor()) );
            }
            // simulate
            updatePaddle(dt / FrameTime);
            updateBalls (dt / FrameTime);
            // draw
            drawBackground();
            drawPaddle();
            drawBalls();

            // update old state for delta
            lastTime = now;
            for (var i = 0; i < Keys.length; i++) {
                wasDown[Keys[i]] = isDown[Keys[i]];
            }
        }
        setInterval(gameLoop, FrameTime);
    </script>

</body>
</html>
